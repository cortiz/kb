[workspace]
members = ["crates/kb-core", "crates/kb"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/cortiz/kb"
license = "MIT OR Apache-2.0"
# Not published to crates.io (a decision of specs/005-ci-release-pipeline); releases are archives.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
kb-core = { path = "crates/kb-core" }
saphyr-parser = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm",
] }
syntect = { version = "5", default-features = false, features = [
  "parsing",
  "default-syntaxes",
  "regex-fancy",
  "yaml-load",
] }
signal-hook = "0.4"
# the same crossterm ratatui uses; the feature lets the UI read keys from /dev/tty when stdin is a pipe
crossterm = { version = "0.29", features = ["use-dev-tty"] }
unicode-width = "0.2"
vt100 = "0.16"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
unicode-normalization = "0.1"
# parses the config file with line numbers and edits it without losing comments (kb config set)
toml_edit = { version = "0.25", default-features = false, features = [
  "parse",
  "display",
] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
assert_cmd = "2"
tempfile = "3"

# Highlighting regexes are compiled and run at runtime; debug builds are ~10x slower otherwise.
[profile.dev.package.syntect]
opt-level = 2

[profile.dev.package.fancy-regex]
opt-level = 2

# Release binaries: smaller and consistent. `panic` stays at its default (unwind) because
# crates/kb/src/main.rs relies on catch_unwind.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
